[package]
name = "awayuki"
version = "0.1.0"
edition = "2021"

[dependencies]
# Desktop shell
tauri = { version = "2.11.2", features = ["devtools", "custom-protocol", "unstable"] }
tauri-plugin-opener = "2"
# Keep JS log forwarding on the log crate path only. Enabling the plugin's
# tracing feature emits a second event through the same tracing subscriber.
tauri-plugin-log = "2.8.0"

# Async / Networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
dirs = "6"
urlencoding = "2"
notify-rust = "4"
regex = "1"

# Yukari Query filter engine
yq = { git = "https://github.com/shibafu528/yqrs.git" }

# Bluesky / AT Protocol
bsky-sdk = "0.1"
atrium-api = "0.25"

# Auto-updater (macOS: Sparkle.framework, Windows: WinSparkle.dll)
[target.'cfg(target_os = "macos")'.dependencies]
sparkle-updater = { git = "https://github.com/hankbao/sparkle-updater.git" }
apple_ai = "0.1"
objc = "0.2"
translation-rs = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
sparkle-updater = { git = "https://github.com/hankbao/sparkle-updater.git" }
tauri-plugin-frame = "1.1.8"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
