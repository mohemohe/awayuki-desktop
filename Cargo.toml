[package]
name = "awayuki"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"
gpui-tokio-bridge = "0.1"

# Async / Networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Assets
rust-embed = "8"

# Image processing
blurhash = "0.2"
image = "0.25"
smallvec = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
dirs = "6"
urlencoding = "2"
notify-rust = "4"

# Auto-updater (macOS: Sparkle.framework, Windows: WinSparkle.dll)
[target.'cfg(target_os = "macos")'.dependencies]
sparkle-updater = { git = "https://github.com/hankbao/sparkle-updater.git" }

[target.'cfg(target_os = "windows")'.dependencies]
sparkle-updater = { git = "https://github.com/hankbao/sparkle-updater.git" }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
