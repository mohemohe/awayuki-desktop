[package]
name = "awayuki"
version = "0.7.1"
edition = "2021"
license = "WTFPL"
repository = "https://github.com/mohemohe/awayuki-desktop"

[dependencies]
# Desktop shell
# `unstable` is currently required only for the embedded sidecar webviews
# (`WebviewBuilder`/`Window::add_child`). `devtools` is intentionally enabled
# in packaged builds so users can collect diagnostics for bug reports.
tauri = { version = "2.11.2", features = ["custom-protocol", "unstable", "devtools"] }
tauri-plugin-opener = "2"
# Keep JS log forwarding on the log crate path only. Enabling the plugin's
# tracing feature emits a second event through the same tracing subscriber.
tauri-plugin-log = "2.8.0"

# Async / Networking
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "http2", "json", "multipart", "rustls-tls", "stream", "system-proxy"] }
http = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "derive"] }
# Pinned to SQLx's exact FFI version. Custom timeline queries install a SQLite
# authorizer and each pooled connection registers the short-search FTS5
# tokenizer on SQLx's locked raw handle; upgrading either side must be reviewed
# together.
libsqlite3-sys = "=0.37.0"

# ICU4X dictionary word segmentation (including non-whitespace punctuation and
# emoji segments) replaces the synchronous trigram and character n-gram search
# indexes. Segmentation runs before the low-priority indexer acquires SQLite's
# writer.
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# User plugins run as ECMAScript modules in an isolated Boa context. A host
# Fetcher implementation provides bounded blocking reqwest I/O; Boa's
# jobs and timers are driven on the dedicated plugin runtime thread.
boa_engine = "=0.22.0"
boa_runtime = "=0.22.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
dirs = "6"
urlencoding = "2"
notify-rust = "4"
regex = "1"
libc = "0.2"
base64 = "0.23"
sha2 = "0.11"

# Yukari Query filter engine
yq = { version = "=0.1.0", git = "https://github.com/shibafu528/yqrs.git", rev = "dc21e95e5db59fd94fecc85dfcd47aa469fcd820" }

# Bluesky / AT Protocol
bsky-sdk = "0.1"
atrium-api = "0.25"

# Platform-specific integrations. Sparkle/WinSparkle preferences are updater
# metadata, not Awayuki user data; the portable data contract continues to be
# satisfied by keeping all application data in `awayuki.db`.
[target.'cfg(target_os = "macos")'.dependencies]
sparkle-updater = { git = "https://github.com/hankbao/sparkle-updater.git", rev = "762e70394d9c835140cb0992b57e4487ec844068" }
apple_ai = "0.1"
objc = "0.2"
translation-rs = "0.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
sparkle-updater = { git = "https://github.com/hankbao/sparkle-updater.git", rev = "762e70394d9c835140cb0992b57e4487ec844068" }
tauri-plugin-frame = "1.1.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
windows-registry = "0.6"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[lints.rust]
# `objc` 0.2.x macros still mention this legacy cfg in macro expansion.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
