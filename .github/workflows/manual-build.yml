name: Manual production build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-production-build
  cancel-in-progress: false

env:
  APP_NAME: Awayuki

jobs:
  prepare:
    name: Select protected source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      source_ref: ${{ steps.metadata.outputs.source_ref }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Checkout protected main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - name: Export immutable metadata
        id: metadata
        run: |
          SOURCE_REF="$(git rev-parse HEAD)"
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          RELEASE_TAG="manual-v${VERSION}-${SOURCE_REF:0:8}-${GITHUB_RUN_NUMBER}"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  quality:
    name: Validate protected source
    needs: prepare
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.prepare.outputs.source_ref }}
      version: ${{ needs.prepare.outputs.version }}

  build:
    name: Build all platform artifacts
    needs: [prepare, quality]
    uses: ./.github/workflows/build-artifacts.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  arch-package-smoke:
    name: Verify Arch package in a clean container
    needs: [prepare, quality]
    uses: ./.github/workflows/arch-package-smoke.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Create manual draft release
    needs: [prepare, build, arch-package-smoke]
    runs-on: ubuntu-22.04
    environment: production-publishing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-artifacts"
          path: artifacts
      - name: Download mandatory 3-OS package smoke summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-smoke-summary
          path: artifacts/verification
      - name: Publish package verification in the release run summary
        run: cat artifacts/verification/package-smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create deterministic source archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          git archive --format=tar.gz --prefix="Awayuki-${VERSION}/" \
            --output="artifacts/Awayuki-${VERSION}-source.tar.gz" "$SOURCE_REF"
      - name: Generate SPDX SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_REF")" \
            bun scripts/generate-sbom.mjs artifacts/awayuki.spdx.json \
            "$VERSION" "$SOURCE_REF"
      - name: Generate and verify artifact manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          bun scripts/artifact-manifest.mjs generate artifacts \
            artifacts/artifact-manifest.json "$VERSION" "$SOURCE_REF"
          bun scripts/artifact-manifest.mjs verify artifacts \
            artifacts/artifact-manifest.json "$VERSION" "$SOURCE_REF"
      - name: Attest manual-build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/macos-artifacts/*.dmg
            artifacts/windows-artifacts/*.zip
            artifacts/linux-artifacts/*.AppImage
            artifacts/${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-source.tar.gz
            artifacts/artifact-manifest.json
      - name: Attest manual-build SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: artifacts/artifact-manifest.json
          sbom-path: artifacts/awayuki.spdx.json
      - name: Create manual draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ needs.prepare.outputs.source_ref }}
          name: ${{ needs.prepare.outputs.release_tag }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macos-artifacts/${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-arm64.dmg
            artifacts/windows-artifacts/${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-windows-x86_64.zip
            artifacts/linux-artifacts/${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-x86_64.AppImage
            artifacts/${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-source.tar.gz
            artifacts/artifact-manifest.json
            artifacts/awayuki.spdx.json
            artifacts/verification/package-smoke-summary.json
