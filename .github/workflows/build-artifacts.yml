name: Build release artifacts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to package
        required: true
        type: string
      version:
        description: Semantic version without a v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: Awayuki
  BINARY_NAME: awayuki

jobs:
  verify-input:
    name: Verify immutable build input
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Require an exact commit and matching version
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/main
          test "$VERSION" = "${VERSION#v}"
          bun scripts/check-version-consistency.mjs "$VERSION"

  macos-build:
    name: Build untrusted macOS payload without signing secrets
    needs: verify-input
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
          targets: aarch64-apple-darwin
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Restore read-only Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: macos-arm64
          save-if: false
      - name: Build ad-hoc application bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x scripts/*.sh
          scripts/build-app-bundle.sh
          codesign -vv --deep --strict build/${{ env.APP_NAME }}.app
          ditto -c -k --keepParent build/${{ env.APP_NAME }}.app build/unsigned-app.zip
      - name: Upload unsigned payload for the isolated signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-unsigned-payload
          path: build/unsigned-app.zip
          if-no-files-found: error
          retention-days: 1

  macos-sign:
    name: Sign and notarize macOS payload
    needs: macos-build
    runs-on: macos-26
    timeout-minutes: 60
    environment: production-signing
    permissions:
      contents: read
    steps:
      - name: Download unsigned payload only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-unsigned-payload
          path: unsigned
      - name: Extract payload and create reviewed entitlements
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p build
          ditto -x -k unsigned/unsigned-app.zip build
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            build/${{ env.APP_NAME }}.app/Contents/Info.plist)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            build/${{ env.APP_NAME }}.app/Contents/Info.plist)" = "$VERSION"
          plutil -create xml1 build/Entitlements.plist
          /usr/libexec/PlistBuddy -c \
            'Add :com.apple.security.cs.allow-jit bool true' build/Entitlements.plist
          /usr/libexec/PlistBuddy -c \
            'Add :com.apple.security.network.client bool true' build/Entitlements.plist
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f certificate.p12
      - name: Sign fixed bundle paths without running repository code
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          APP=build/${{ env.APP_NAME }}.app
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp \
            --entitlements build/Entitlements.plist "$APP/Contents/MacOS/${{ env.BINARY_NAME }}"
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp \
            --entitlements build/Entitlements.plist "$APP"
          codesign -vv --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > build/macos-entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c Print build/macos-entitlements.plist \
            | grep -c 'com.apple.security.')" -eq 2
          /usr/libexec/PlistBuddy -c \
            'Print :com.apple.security.cs.allow-jit' build/macos-entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c \
            'Print :com.apple.security.network.client' build/macos-entitlements.plist | grep -qx true
      - name: Notarize application bundle
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          xcrun notarytool store-credentials notarytool-profile \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          ditto -c -k --keepParent build/${{ env.APP_NAME }}.app build/notarization.zip
          xcrun notarytool submit build/notarization.zip \
            --keychain-profile notarytool-profile --wait
          xcrun stapler staple build/${{ env.APP_NAME }}.app
          rm -f build/notarization.zip
      - name: Create, sign, and notarize DMG
        env:
          VERSION: ${{ inputs.version }}
          SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          DMG_TEMP=build/dmg-temp
          mkdir -p "$DMG_TEMP"
          ditto build/${{ env.APP_NAME }}.app "$DMG_TEMP/${{ env.APP_NAME }}.app"
          ln -s /Applications "$DMG_TEMP/Applications"
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$DMG_TEMP" \
            -ov -format UDZO build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg
          rm -rf "$DMG_TEMP"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp \
            build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg
          xcrun notarytool submit \
            build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg \
            --keychain-profile notarytool-profile --wait
          xcrun stapler staple build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg
          codesign -vv --strict build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg
      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-artifacts
          path: |
            build/${{ env.APP_NAME }}-${{ inputs.version }}-arm64.dmg
            build/macos-entitlements.plist
          if-no-files-found: error
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  macos-smoke:
    name: Smoke-test signed macOS package without secrets
    needs: macos-sign
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout smoke harness only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install Bun for the deterministic SQLite fixture
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Download signed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-artifacts
          path: artifacts
      - name: Install, launch, and remove signed package
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/package-smoke.sh macos artifacts/${{ env.APP_NAME }}-${VERSION}-arm64.dmg
      - name: Upload macOS package smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-smoke-macos
          path: build/package-smoke-macos.json
          if-no-files-found: error

  windows:
    name: Windows x86_64 ZIP
    needs: verify-input
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-msvc
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Restore read-only Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: windows-x86_64
          save-if: false
      - name: Install packaging tools
        shell: pwsh
        run: choco install imagemagick 7zip -y
      - name: Generate Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path icons
          magick assets/icons/AppIcon.png -define icon:auto-resize=256,128,64,48,32,16 icons/icon.ico
      - name: Build ZIP through the shared packaging script
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/build-windows-zip.sh
      - name: Smoke-test packaged contents
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/package-smoke.sh windows build/${APP_NAME}-${VERSION}-windows-x86_64.zip
      - name: Upload Windows package smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-smoke-windows
          path: build/package-smoke-windows.json
          if-no-files-found: error
      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-artifacts
          path: build/${{ env.APP_NAME }}-${{ inputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    needs: verify-input
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libssl-dev libsqlite3-dev libasound2-dev \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev imagemagick file wget xvfb
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
          targets: x86_64-unknown-linux-gnu
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Restore read-only Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: linux-x86_64
          save-if: false
      - name: Build AppImage through the shared packaging script
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x scripts/*.sh
          scripts/build-appimage.sh
      - name: Smoke-test packaged contents
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/package-smoke.sh linux build/${{ env.APP_NAME }}-${VERSION}-x86_64.AppImage
      - name: Upload Linux package smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-smoke-linux
          path: build/package-smoke-linux.json
          if-no-files-found: error
      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-artifacts
          path: build/${{ env.APP_NAME }}-${{ inputs.version }}-x86_64.AppImage
          if-no-files-found: error

  package-smoke-summary:
    name: Require and summarize all package smoke results
    needs: [macos-smoke, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout the reviewed summary harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Download every OS smoke report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-smoke-*
          path: smoke-reports
          merge-multiple: true
      - name: Fail on a skipped OS and write the release summary
        run: |
          bun scripts/summarize-package-smoke.mjs \
            build/package-smoke-summary.json \
            smoke-reports/package-smoke-macos.json \
            smoke-reports/package-smoke-windows.json \
            smoke-reports/package-smoke-linux.json
          cat build/package-smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package smoke summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-smoke-summary
          path: |
            build/package-smoke-summary.json
            build/package-smoke-summary.md
          if-no-files-found: error
