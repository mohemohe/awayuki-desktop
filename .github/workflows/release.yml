name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Awayuki

jobs:
  verify-release-ref:
    name: Verify signed release source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_ref: ${{ steps.metadata.outputs.source_ref }}
    steps:
      - name: Checkout tag history without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require signed annotated tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          TAG_JSON="$(gh api "repos/${{ github.repository }}/git/ref/tags/$GITHUB_REF_NAME")"
          TAG_TYPE="$(jq -r '.object.type' <<<"$TAG_JSON")"
          TAG_OBJECT="$(jq -r '.object.sha' <<<"$TAG_JSON")"
          test "$TAG_TYPE" = tag
          gh api "repos/${{ github.repository }}/git/tags/$TAG_OBJECT" \
            --jq 'select(.verification.verified == true) | .verification.reason' \
            | grep -q .
      - name: Export immutable metadata
        id: metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Validate release source
    needs: verify-release-ref
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.verify-release-ref.outputs.source_ref }}
      version: ${{ needs.verify-release-ref.outputs.version }}

  build:
    name: Build all platform artifacts
    needs: [verify-release-ref, quality]
    uses: ./.github/workflows/build-artifacts.yml
    with:
      source_ref: ${{ needs.verify-release-ref.outputs.source_ref }}
      version: ${{ needs.verify-release-ref.outputs.version }}
    secrets: inherit

  arch-package-smoke:
    name: Verify Arch package in a clean container
    needs: [verify-release-ref, quality]
    uses: ./.github/workflows/arch-package-smoke.yml
    with:
      source_ref: ${{ needs.verify-release-ref.outputs.source_ref }}
      version: ${{ needs.verify-release-ref.outputs.version }}

  publish:
    name: Create draft GitHub release
    needs: [verify-release-ref, build, arch-package-smoke]
    runs-on: ubuntu-22.04
    environment: production-publishing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify-release-ref.outputs.source_ref }}
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-artifacts"
          path: artifacts
      - name: Download mandatory 3-OS package smoke summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-smoke-summary
          path: artifacts/verification
      - name: Publish package verification in the release run summary
        run: cat artifacts/verification/package-smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create deterministic source archive
        env:
          VERSION: ${{ needs.verify-release-ref.outputs.version }}
          SOURCE_REF: ${{ needs.verify-release-ref.outputs.source_ref }}
        run: |
          git archive --format=tar.gz --prefix="Awayuki-${VERSION}/" \
            --output="artifacts/Awayuki-${VERSION}-source.tar.gz" "$SOURCE_REF"
      - name: Generate SPDX SBOM
        env:
          VERSION: ${{ needs.verify-release-ref.outputs.version }}
          SOURCE_REF: ${{ needs.verify-release-ref.outputs.source_ref }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_REF")" \
            bun scripts/generate-sbom.mjs artifacts/awayuki.spdx.json \
            "$VERSION" "$SOURCE_REF"
      - name: Generate and verify artifact manifest
        env:
          VERSION: ${{ needs.verify-release-ref.outputs.version }}
          SOURCE_REF: ${{ needs.verify-release-ref.outputs.source_ref }}
        run: |
          bun scripts/artifact-manifest.mjs generate artifacts \
            artifacts/artifact-manifest.json "$VERSION" "$SOURCE_REF"
          bun scripts/artifact-manifest.mjs verify artifacts \
            artifacts/artifact-manifest.json "$VERSION" "$SOURCE_REF"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            artifacts/macos-artifacts/*.dmg
            artifacts/windows-artifacts/*.zip
            artifacts/linux-artifacts/*.AppImage
            artifacts/${{ env.APP_NAME }}-${{ needs.verify-release-ref.outputs.version }}-source.tar.gz
            artifacts/artifact-manifest.json
      - name: Attest release SBOM
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-path: artifacts/artifact-manifest.json
          sbom-path: artifacts/awayuki.spdx.json
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Awayuki v${{ needs.verify-release-ref.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macos-artifacts/${{ env.APP_NAME }}-${{ needs.verify-release-ref.outputs.version }}-arm64.dmg
            artifacts/windows-artifacts/${{ env.APP_NAME }}-${{ needs.verify-release-ref.outputs.version }}-windows-x86_64.zip
            artifacts/linux-artifacts/${{ env.APP_NAME }}-${{ needs.verify-release-ref.outputs.version }}-x86_64.AppImage
            artifacts/${{ env.APP_NAME }}-${{ needs.verify-release-ref.outputs.version }}-source.tar.gz
            artifacts/artifact-manifest.json
            artifacts/awayuki.spdx.json
            artifacts/verification/package-smoke-summary.json
