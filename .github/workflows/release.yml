name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: Awayuki
  BINARY_NAME: awayuki

jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f certificate.p12

      - name: Build, bundle, and sign
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-app-bundle.sh

      - name: Verify code signature
        run: |
          codesign -vv --deep --strict build/${{ env.APP_NAME }}.app

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

          ditto -c -k --keepParent \
            "build/${{ env.APP_NAME }}.app" \
            "build/notarization.zip"

          xcrun notarytool submit "build/notarization.zip" \
            --keychain-profile "notarytool-profile" \
            --wait

          xcrun stapler staple "build/${{ env.APP_NAME }}.app"

          rm -f build/notarization.zip

      - name: Create DMG and ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          bash scripts/create-dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" 2>/dev/null || true

          xcrun notarytool submit \
            "build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg" \
            --keychain-profile "notarytool-profile" \
            --wait

          xcrun stapler staple \
            "build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Awayuki v${{ steps.version.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-arm64.dmg
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-arm64.zip

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
