name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: Awayuki
  BINARY_NAME: awayuki

jobs:
  build-macos:
    name: Build macOS (Sign & Notarize)
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64
          save-if: false

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f certificate.p12

      - name: Build, bundle, and sign
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-app-bundle.sh

      - name: Verify code signature
        run: |
          codesign -vv --deep --strict build/${{ env.APP_NAME }}.app

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

          ditto -c -k --keepParent \
            "build/${{ env.APP_NAME }}.app" \
            "build/notarization.zip"

          xcrun notarytool submit "build/notarization.zip" \
            --keychain-profile "notarytool-profile" \
            --wait

          xcrun stapler staple "build/${{ env.APP_NAME }}.app"

          rm -f build/notarization.zip

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          bash scripts/create-dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" 2>/dev/null || true

          xcrun notarytool submit \
            "build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg" \
            --keychain-profile "notarytool-profile" \
            --wait

          xcrun stapler staple \
            "build/${{ env.APP_NAME }}-${VERSION}-arm64.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-arm64.dmg

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64
          save-if: false

      - name: Install ImageMagick
        shell: pwsh
        run: |
          choco install imagemagick -y
          refreshenv

      - name: Generate ICO icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          magick "assets/icons/AppIcon.png" `
            "(" -clone 0 -resize 16x16 ")" `
            "(" -clone 0 -resize 32x32 ")" `
            "(" -clone 0 -resize 48x48 ")" `
            "(" -clone 0 -resize 64x64 ")" `
            "(" -clone 0 -resize 128x128 ")" `
            "(" -clone 0 -resize 256x256 ")" `
            -delete 0 `
            "build/AppIcon.ico"

      - name: Fetch dependencies (to populate cargo git checkouts)
        run: cargo fetch

      - name: Download and replace WinSparkle x64 binaries
        shell: pwsh
        run: |
          # Download official WinSparkle release with x64 binaries
          $url = "https://github.com/vslavik/winsparkle/releases/download/v0.9.2/WinSparkle-0.9.2.zip"
          Invoke-WebRequest -Uri $url -OutFile winsparkle.zip
          Expand-Archive -Path winsparkle.zip -DestinationPath winsparkle-extracted

          # Find the winsparkle-sys directory in cargo git checkouts
          $sysDir = Get-ChildItem -Path "$env:USERPROFILE/.cargo/git/checkouts" -Recurse -Directory -Filter "winsparkle-sys" -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "WinSparkle.lib") } |
            Select-Object -First 1

          if ($sysDir) {
            Write-Host "Replacing x86 WinSparkle with x64 in: $($sysDir.FullName)"
            Copy-Item "winsparkle-extracted/WinSparkle-0.9.2/x64/Release/WinSparkle.dll" "$($sysDir.FullName)/WinSparkle.dll" -Force
            Copy-Item "winsparkle-extracted/WinSparkle-0.9.2/x64/Release/WinSparkle.lib" "$($sysDir.FullName)/WinSparkle.lib" -Force
          } else {
            Write-Error "winsparkle-sys directory not found in cargo checkouts"
            exit 1
          }

          # Keep x64 DLL for bundling later
          New-Item -ItemType Directory -Force -Path build
          Copy-Item "winsparkle-extracted/WinSparkle-0.9.2/x64/Release/WinSparkle.dll" "build/WinSparkle.dll"

          Remove-Item -Recurse -Force winsparkle.zip, winsparkle-extracted

      - name: Build release binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run build
          cargo build --release

      - name: Create ZIP
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $STAGING = "build/windows-staging"
          $ZIP_NAME = "${{ env.APP_NAME }}-${VERSION}-windows-x86_64.zip"

          New-Item -ItemType Directory -Force -Path $STAGING

          # Copy binary
          Copy-Item "target/release/${{ env.BINARY_NAME }}.exe" "$STAGING/"

          # Copy x64 WinSparkle.dll (downloaded earlier)
          Copy-Item "build/WinSparkle.dll" "$STAGING/"

          # Create ZIP
          Compress-Archive -Path "$STAGING/*" -DestinationPath "build/$ZIP_NAME"
          Remove-Item -Recurse -Force $STAGING

          Write-Host "Created: build/$ZIP_NAME"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x86_64.zip

  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libfontconfig1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev libsqlite3-dev libasound2-dev \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers \
            libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev \
            imagemagick \
            file wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64
          save-if: false

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-x86_64.AppImage

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]

    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Awayuki v${{ steps.version.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macos-artifacts/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-arm64.dmg
            artifacts/windows-artifacts/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x86_64.zip
            artifacts/linux-artifacts/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-x86_64.AppImage
