name: Dependency Audit

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - docs/baselines/dependency-features-before.json
      - scripts/dependency-metrics.mjs
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Record and enforce dependency feature surface
        run: bun run dependency:metrics
      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit advisories
        # Vulnerabilities remain fatal. Informational warnings such as the
        # unavoidable GTK3 maintenance notices must not fail every audit run.
        # quick-xml 0.37 is constrained by notify-rust's Windows-only
        # tauri-winrt-notification dependency and only writes our generated
        # toast XML. rsa belongs to SQLx's unselected non-SQLite drivers and is
        # absent from the all-target feature graph.
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
      - name: Enforce dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Upload dependency metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-metrics-${{ github.sha }}
          path: build/dependency-metrics.json
          if-no-files-found: error
